<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>百人一首 20枚チャレンジ</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f7f0df;color:#2d251b;height:100dvh;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.topbar{padding:max(10px,env(safe-area-inset-top)) 14px 8px;background:#6f1d2b;color:#fff;display:flex;justify-content:space-between;align-items:end;box-shadow:0 2px 8px #0003;z-index:2}.title{font-weight:800;font-size:17px}.stats{font-size:13px;text-align:right}.board{flex:1;min-height:0;overflow:auto;padding:12px;background:linear-gradient(#e8d6a8,#d8bf82);border-bottom:4px solid #6f1d2b}.grid{display:grid;grid-template-columns:repeat(4,minmax(76px,1fr));gap:10px;min-width:350px;padding-bottom:20px}.card{background:#fffdf4;border:1px solid #c6b07b;border-radius:8px;min-height:150px;padding:8px 5px;box-shadow:0 2px 5px #0002;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;line-height:1.6;font-family:serif;font-size:15px;cursor:pointer;user-select:none;position:relative}.card:active{transform:scale(.97)}.card.correct{outline:4px solid #278b4e;background:#eaffef}.card.wrong{animation:shake .25s;background:#ffe6e6}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reader{flex:0 0 34%;min-height:230px;background:#fffaf0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:relative}.label{text-align:center;color:#7c6a4b;font-size:12px;letter-spacing:.15em}.poem{font-family:serif;font-weight:700;font-size:22px;line-height:1.75;text-align:center;margin:8px auto;max-width:520px;min-height:82px}.hint{text-align:center;font-size:12px;color:#8b7b61}.message{position:absolute;inset:0;background:#fffaf0f2;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5}.message.show{display:flex}.big{font-weight:900;font-size:36px;color:#a22635;text-shadow:0 2px #f0cf77}.points{font-size:48px;font-weight:900;color:#b58116}.btn{border:0;border-radius:999px;background:#6f1d2b;color:white;font-weight:800;padding:12px 22px;font-size:16px;margin-top:12px}.start{position:fixed;inset:0;background:#f7f0df;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.start h1{color:#6f1d2b;font-family:serif}.start p{line-height:1.7}.start.hide{display:none}@media(max-width:390px){.grid{grid-template-columns:repeat(3,minmax(90px,1fr));}.card{min-height:145px}.poem{font-size:20px}}
</style></head><body><div class='app'><header class='topbar'><div><div class='title'>🎴 百人一首 20枚チャレンジ</div><small>読み札を探してタップ！</small></div><div class='stats'>残り <b id='remain'>20</b>枚<br>SCORE <b id='score'>0</b></div></header><main class='board' id='board'><div class='grid' id='grid'></div></main><section class='reader'><div class='label'>ただいまの読み札</div><div class='poem' id='poem'></div><div class='hint'>文字が少しずつ現れます。上の札から探そう。</div><div class='message' id='message'><div class='big' id='praise'>あっぱれ！</div><div class='points' id='points'>100点</div></div></section></div><div class='start' id='start'><div><h1>百人一首<br>20枚チャレンジ</h1><p>下に現れる歌を読み、<br>上の20枚から同じ札を探してタップ。<br><b>3秒以内なら100点！</b><br>遅くなるほど減点、最低60点。</p><button class='btn' id='startBtn'>いざ、勝負！</button></div></div><script>
const poems=[
['秋の田の かりほの庵の 苫をあらみ','わが衣手は 露にぬれつつ'],['春すぎて 夏来にけらし 白妙の','衣ほすてふ 天の香具山'],['あしびきの 山鳥の尾の しだり尾の','ながながし夜を ひとりかも寝む'],['田子の浦に うち出でて見れば 白妙の','富士の高嶺に 雪は降りつつ'],['奥山に 紅葉踏み分け 鳴く鹿の','声聞く時ぞ 秋は悲しき'],['かささぎの 渡せる橋に 置く霜の','白きを見れば 夜ぞ更けにける'],['天の原 ふりさけ見れば 春日なる','三笠の山に 出でし月かも'],['わが庵は 都のたつみ しかぞ住む','世をうぢ山と 人はいふなり'],['花の色は 移りにけりな いたづらに','わが身世にふる ながめせしまに'],['これやこの 行くも帰るも 別れては','知るも知らぬも 逢坂の関'],['わたの原 八十島かけて 漕ぎ出でぬと','人には告げよ 海人の釣舟'],['天つ風 雲の通ひ路 吹きとぢよ','乙女の姿 しばしとどめむ'],['筑波嶺の 峰より落つる みなの川','恋ぞ積もりて 淵となりぬる'],['陸奥の しのぶもぢずり 誰ゆゑに','乱れそめにし われならなくに'],['君がため 春の野に出でて 若菜摘む','わが衣手に 雪は降りつつ'],['立ち別れ いなばの山の 峰に生ふる','まつとし聞かば 今帰り来む'],['ちはやぶる 神代も聞かず 竜田川','からくれなゐに 水くくるとは'],['住の江の 岸に寄る波 よるさへや','夢の通ひ路 人目よくらむ'],['難波潟 短き蘆の ふしの間も','逢はでこの世を 過ぐしてよとや'],['わびぬれば 今はた同じ 難波なる','みをつくしても 逢はむとぞ思ふ']];
let deck=[],queue=[],current=null,score=0,startTime=0,timer=null,locked=false;
const grid=document.getElementById('grid'),poem=document.getElementById('poem'),msg=document.getElementById('message');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){grid.innerHTML='';deck.forEach((p,i)=>{let d=document.createElement('div');d.className='card';d.dataset.id=p.id;d.textContent=p.lower;d.onclick=()=>pick(p.id,d);grid.appendChild(d)})}
function next(){if(!queue.length){poem.textContent='全20枚 終了！';document.getElementById('praise').textContent='🏆 お見事！';document.getElementById('points').textContent=`合計 ${score}点`;msg.classList.add('show');return}locked=false;current=queue.shift();startTime=performance.now();let full=current.upper+'　'+current.lower;poem.textContent='';let n=0;clearInterval(timer);timer=setInterval(()=>{poem.textContent=full.slice(0,++n);if(n>=full.length)clearInterval(timer)},140)}
function pick(id,el){if(locked||!current)return;if(id!==current.id){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),300);return}locked=true;clearInterval(timer);let sec=(performance.now()-startTime)/1000;let pts=sec<=3?100:Math.max(60,100-Math.ceil(sec-3)*2);score+=pts;document.getElementById('score').textContent=score;document.getElementById('remain').textContent=queue.length;el.classList.add('correct');let praise=pts===100?'🌸 あっぱれ！':pts>=90?'✨ お見事！':pts>=80?'よし！':'正解！';document.getElementById('praise').textContent=praise;document.getElementById('points').textContent=pts+'点';msg.classList.add('show');setTimeout(()=>{msg.classList.remove('show');el.remove();deck=deck.filter(x=>x.id!==id);next()},850)}
function begin(){let items=poems.map((p,i)=>({id:i,upper:p[0],lower:p[1]}));deck=shuffle(items);queue=shuffle(items);score=0;document.getElementById('score').textContent=0;document.getElementById('remain').textContent=20;render();document.getElementById('start').classList.add('hide');next()}
document.getElementById('startBtn').onclick=begin;
</script></body></html>
